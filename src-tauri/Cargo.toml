[package]
name = "renderloft"
version = "0.1.1"
description = "RenderLoft local daemon for RunningHub AI applications"
license = "MIT"
edition = "2021"
default-run = "renderloft"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
clap = { version = "4.5", features = ["string"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
async-trait = "0.1"
sha2 = "0.10"
utoipa = "5"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 三处 Win32 调用，各自都有非用不可的理由：
# ① `GetStdHandle` + `SetHandleInformation`：拉 daemon 之前必须关掉本进程标准句柄的
#    "可继承"位，否则子进程会攥住调用方的管道（机制与实测见 `v2/clients/daemon_boot.rs`）。
# ② `SHOpenFolderAndSelectItems`：打开下载目录并**选中文件**。**不能**用 `explorer.exe /select,`
#    那条老命令行——实测（用户复现）：下载文件夹已经开着一个窗口时，它认不出参数，退回
#    Explorer 的默认目录（文档）。Shell API 没有这个问题，它还会复用已有窗口。
# ③ `ShellExecuteW`：**打开目录**（不是"在父目录里选中它"）。`SHOpenFolderAndSelectItems`
#    拿到目录的 PIDL 时打开的是父目录——两种情形必须分开走（实测，见 `application/settings.rs`）。
# ④ `RegGetValueW`：读「Internet 选项」里的系统代理（`Win32_System_Registry`）。
#    这是 reqwest **不会**读的那一份，而 Clash / v2rayN 默认只改注册表、不改环境变量。
# 版本刻意与锁文件里已有的那份对齐（0.60.2），离线也能构建。
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
