[package]
name = "renderloft-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# `tray-icon`：常驻托盘（关窗不停任务）；`image-png`：托盘的 PNG 图标解码。
tauri = { version = "2.3", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
# 两件事用到 Win32：
# ① 单实例：命名互斥体 + 找到已有窗口并前置（官方插件不在本机的离线缓存里）。
#    `Win32_Security` 是 `CreateMutexW` 的门（它的签名要 `SECURITY_ATTRIBUTES`）。
# ② `SHOpenFolderAndSelectItems`（见 `src/reveal.rs`）：替 daemon 打开下载目录并选中文件。
#    **必须由外壳做**——daemon 是后台进程，Windows 的前台锁不允许它把新窗口带到前面，
#    用户看到的是"任务栏图标在闪，但窗口没弹出来"（实测）。
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
