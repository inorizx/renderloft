name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # desktop/ 是独立 crate（不在 src-tauri 的 workspace 下），必须单独检查
      - run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: node scripts/check-layers.mjs
      # 版本号散在 6 处（package.json / 两个 Cargo.toml / tauri.conf.json / 两个 Cargo.lock），
      # 不一致时编译测试打包全绿、只有 updater 会静默判断错。见 scripts/version.mjs。
      - run: node scripts/version.mjs check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm build

  # Linux 无头便携包的**真打包 + 全链路冒烟**。
  #
  # 与 windows-installer 同理：打包路径没有自动化跑过就会**静默烂掉**。Linux 这边烂掉的方式
  # 更隐蔽——包在、二进制也在，但少了 dist/、或解压后根本拉不起 daemon，用户拿到手才发现。
  # 所以这个 job 不只构建：它把产出的 tar.gz 解压到临时目录，用**包里的**三件套真跑一遍
  # （CLI → daemon → 控制台 → MCP），再上传产物供下载调试。
  linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Linux 侧 keyring 走 secret-service → libdbus-sys 编译期要 dbus-1.pc；
      # 缺 libdbus-1-dev 时 build.rs 直接 panic（首跑实测：41 秒红）。
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:linux
      - run: node scripts/smoke-linux.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: renderloft-linux-portable
          path: RenderLoft_*_x64-linux.tar.gz
          # 打包静默失败（没产出 tar.gz）时必须红，不能只是"没东西可传"
          if-no-files-found: error
          retention-days: 14
