name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # desktop/ 是独立 crate（不在 src-tauri 的 workspace 下），必须单独检查
      - run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: node scripts/check-layers.mjs
      # 版本号散在 6 处（package.json / 两个 Cargo.toml / tauri.conf.json / 两个 Cargo.lock），
      # 不一致时编译测试打包全绿、只有 updater 会静默判断错。见 scripts/version.mjs。
      - run: node scripts/version.mjs check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm build

  # 真打包：产出 NSIS 安装包并上传。
  #
  # 为什么这个 job 必须存在（而不只是"能编译"）：打包这条路一旦没有自动化跑过，就会**静默
  # 烂掉**——实测过一次，`desktop/tauri.conf.json` 的 `beforeBuildCommand` 工作目录写错，
  # pnpm 直接报 ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND，`bundle/` 目录从未出现、安装包一次
  # 都没成功产出过，而 `pnpm verify`、300+ 个测试、CI 全是绿的。
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: pnpm install --frozen-lockfile
      # dist/ 必须先存在：desktop 的 `tauri::generate_context!()` 在编译期内嵌前端产物，
      # 而 `bundle.resources` 现在也把 dist/ 一起打进包（daemon 靠它伺服控制台）。
      - run: pnpm build
      # 三个 release 二进制也必须**先**存在：tauri-build 的 build script 会逐个校验
      # `bundle.resources` 里列出的路径，缺一个就直接
      # `resource path ... doesn't exist` —— 而 desktop 的 clippy 同样要走 build script。
      # 实测（2026-10-09）：在干净 checkout 上先跑 desktop clippy **必红**，
      # 与代码质量无关，纯粹是"资源还没编译出来"。
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin renderloft --bin renderloft-cli --bin renderloft-mcp
      - run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      # 编译外壳 + tauri build + makensis，一步到位（前端与二进制都已就绪，这里是增量）
      - run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: renderloft-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          # 打包静默失败（没产出安装包）时必须红，不能只是"没东西可传"
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: renderloft-windows-binaries
          path: |
            src-tauri/target/release/renderloft.exe
            src-tauri/target/release/renderloft-cli.exe
            src-tauri/target/release/renderloft-mcp.exe
          if-no-files-found: error
          retention-days: 14
