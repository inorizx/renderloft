name: Windows installer

# 为什么这个 job 单独成文件（2026-10-18）：
#
# 它是 CI 里**唯一** 13–15 分钟的 job（编译外壳 + `tauri build` + makensis），而它的独特价值只在
# 动到**桌面壳 / 打包配置 / 依赖清单**时才可能被破坏 —— v2 与前端逻辑由 `ci.yml` 的 `checks` 与
# `linux-portable` 把关。实测：连续 6 个纯 v2/前端的 PR 里它照样全编了一遍，**没提供任何额外
# 信息**，只是让每个 PR 多等 13 分钟。
#
# 所以这里分成两个触发条件，**不是简单地"少跑一道保险"**：
#   * **合进 main 的 push：无条件跑** —— main 上永远有一次完整的打包验证，坏了在**发布之前**
#     就能发现（这正是当初加这个 job 的原因：打包路径没人跑就会静默烂掉）；
#   * **PR：只在改到下面这些路径时跑** —— 反馈快，而该跑的时候一次不落。
#
# ⚠️ 下面这份 `paths:` 是**判据本身**，不是优化开关。少了哪一条，那条路径上的破坏就会**静默**
# 漏到发布时才发现：
#   * `desktop/**` —— 外壳代码与 `tauri.conf.json`（打包配置就在里面）；
#   * 两个 crate 的 `Cargo.toml` / `Cargo.lock` —— 依赖变了才可能只在这条路上炸；
#   * `package.json` / `pnpm-lock.yaml` —— 同上（pnpm 依赖）；
#   * `scripts/build-windows.mjs` —— 打包脚本自己；
#   * 两个 workflow 文件 —— 改 CI 必须让 CI 自己跑一遍。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'desktop/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'desktop/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/build-windows.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

jobs:
  # 真打包：产出 NSIS 安装包并上传。
  #
  # 为什么这个 job 必须存在（而不只是"能编译"）：打包这条路一旦没有自动化跑过，就会**静默
  # 烂掉**——实测过一次，`desktop/tauri.conf.json` 的 `beforeBuildCommand` 工作目录写错，
  # pnpm 直接报 ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND，`bundle/` 目录从未出现、安装包一次
  # 都没成功产出过，而 `pnpm verify`、300+ 个测试、CI 全是绿的。
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: pnpm install --frozen-lockfile
      # dist/ 必须先存在：desktop 的 `tauri::generate_context!()` 在编译期内嵌前端产物，
      # 而 `bundle.resources` 现在也把 dist/ 一起打进包（daemon 靠它伺服控制台）。
      - run: pnpm build
      # 三个 release 二进制也必须**先**存在：tauri-build 的 build script 会逐个校验
      # `bundle.resources` 里列出的路径，缺一个就直接
      # `resource path ... doesn't exist` —— 而 desktop 的 clippy 同样要走 build script。
      # 实测（2026-10-09）：在干净 checkout 上先跑 desktop clippy **必红**，
      # 与代码质量无关，纯粹是"资源还没编译出来"。
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin renderloft --bin renderloft-cli --bin renderloft-mcp
      - run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      # 编译外壳 + tauri build + makensis，一步到位（前端与二进制都已就绪，这里是增量）
      - run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: renderloft-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          # 打包静默失败（没产出安装包）时必须红，不能只是"没东西可传"
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: renderloft-windows-binaries
          path: |
            src-tauri/target/release/renderloft.exe
            src-tauri/target/release/renderloft-cli.exe
            src-tauri/target/release/renderloft-mcp.exe
          if-no-files-found: error
          retention-days: 14
